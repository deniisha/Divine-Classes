
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Enquiry | Divine Classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">DIVINE<span>CLASSES.</span></a>
        <a href="index.html" class="nav-btn">← Back to Home</a>
    </nav>
</header>

<section class="enquiry-page">

    <div class="enquiry-header">
        <span class="tag">✦ ADMISSIONS OPEN</span>
        <h1>Join <span>Divine Classes</span></h1>
        <p>Fill in your details to begin your learning journey.</p>
    </div>

    <div class="enquiry-form">
        <h2>Admission Enquiry Form</h2>
        <p>Student Information</p>

        <form id="enquiryForm">

            <label>Student Full Name *</label>
            <input type="text" id="studentName" placeholder="Enter full name" required>

            <label>Father's / Guardian's Name *</label>
            <input type="text" id="guardianName" placeholder="Enter guardian name" required>

            <label>Mobile Number *</label>
            <input type="tel" id="studentPhone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>

            <label>Email Address</label>
            <input type="email" id="studentEmail" placeholder="Enter email address">

            <label>Select Course *</label>
            <select id="studentCourse" required>
                <option value="">Select your course</option>
                <option>B.Sc - All Semesters</option>
                <option>Class 11th - Mathematics & Physics</option>
                <option>Class 12th - Mathematics & Physics</option>
            </select>

            <label>School / College Name</label>
            <input type="text" id="schoolName" placeholder="Enter school or college name">

            <label>Address</label>
            <textarea id="studentAddress" placeholder="Enter your address"></textarea>

            <label>Your Message</label>
            <textarea id="studentMessage" placeholder="Any questions or queries?"></textarea>

            <button type="submit" class="primary-btn">
                Submit Enquiry ↗
            </button>

        </form>
    </div>

</section>

<script src="script.js"></script>
</body>
</html>
